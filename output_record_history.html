<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>InsideProps – Pick Record History</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#08080d;color:#e0e0f0;font-family:'Inter',sans-serif;min-height:100vh;padding:0 0 60px}
  .header{background:linear-gradient(135deg,#0f0f1a 0%,#12121f 100%);border-bottom:1px solid rgba(245,158,11,0.2);padding:24px 20px;text-align:center}
  .header h1{font-family:'Oswald',sans-serif;font-size:28px;font-weight:700;color:#f59e0b;letter-spacing:.05em}
  .header p{color:#6b6b80;font-size:13px;margin-top:6px}
  .container{max-width:960px;margin:0 auto;padding:24px 16px}

  /* Overall record banner */
  .record-banner{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:28px}
  .stat-card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:18px 20px;text-align:center}
  .stat-card.highlight{background:rgba(245,158,11,0.07);border-color:rgba(245,158,11,0.28)}
  .stat-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#6b6b80;margin-bottom:6px}
  .stat-value{font-family:'Oswald',sans-serif;font-size:32px;font-weight:700;color:#f0f0f5}
  .stat-value.green{color:#4ade80}
  .stat-value.yellow{color:#f59e0b}
  .stat-value.red{color:#f87171}

  /* Date selector */
  .section-title{font-family:'Oswald',sans-serif;font-size:16px;font-weight:600;color:#f59e0b;letter-spacing:.05em;text-transform:uppercase;margin-bottom:14px}
  .date-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}
  .date-btn{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:8px 14px;font-size:12px;font-weight:600;color:#9090a8;cursor:pointer;transition:all .2s}
  .date-btn:hover{border-color:rgba(245,158,11,0.4);color:#f59e0b}
  .date-btn.active{background:rgba(245,158,11,0.1);border-color:rgba(245,158,11,0.5);color:#f59e0b}
  .date-btn.has-picks{color:#c0c0d8}

  /* Day detail panel */
  .day-panel{display:none}
  .day-panel.active{display:block}
  .day-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:16px}
  .day-title{font-family:'Oswald',sans-serif;font-size:22px;font-weight:700;color:#f0f0f5}
  .day-record{display:flex;gap:10px;align-items:center}
  .day-badge{font-size:13px;font-weight:700;padding:4px 12px;border-radius:6px}
  .badge-w{background:rgba(74,222,128,0.12);color:#4ade80;border:1px solid rgba(74,222,128,0.3)}
  .badge-l{background:rgba(248,113,113,0.12);color:#f87171;border:1px solid rgba(248,113,113,0.3)}
  .badge-p{background:rgba(148,163,184,0.12);color:#94a3b8;border:1px solid rgba(148,163,184,0.3)}
  .badge-v{background:rgba(168,85,247,0.1);color:#c084fc;border:1px solid rgba(168,85,247,0.3)}
  .win-pct{font-size:13px;color:#6b6b80;font-weight:600}

  .picks-table{width:100%;border-collapse:collapse}
  .picks-table th{text-align:left;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#6b6b80;padding:8px 12px;border-bottom:1px solid rgba(255,255,255,0.07)}
  .picks-table td{padding:10px 12px;font-size:13px;border-bottom:1px solid rgba(255,255,255,0.04);vertical-align:middle}
  .picks-table tr:last-child td{border-bottom:none}
  .picks-table tr:hover td{background:rgba(255,255,255,0.02)}
  .sport-tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;text-transform:uppercase}
  .sport-nba{background:rgba(249,115,22,0.12);color:#fb923c;border:1px solid rgba(249,115,22,0.2)}
  .sport-mlb{background:rgba(59,130,246,0.12);color:#60a5fa;border:1px solid rgba(59,130,246,0.2)}
  .sport-nhl{background:rgba(6,182,212,0.12);color:#22d3ee;border:1px solid rgba(6,182,212,0.2)}
  .sport-nfl{background:rgba(16,185,129,0.12);color:#34d399;border:1px solid rgba(16,185,129,0.2)}
  .result-tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:5px}
  .result-win{background:rgba(74,222,128,0.12);color:#4ade80;border:1px solid rgba(74,222,128,0.3)}
  .result-loss{background:rgba(248,113,113,0.12);color:#f87171;border:1px solid rgba(248,113,113,0.3)}
  .result-push{background:rgba(148,163,184,0.12);color:#94a3b8;border:1px solid rgba(148,163,184,0.3)}
  .result-void{background:rgba(168,85,247,0.1);color:#c084fc;border:1px solid rgba(168,85,247,0.3)}
  .result-pending{background:rgba(245,158,11,0.08);color:#fbbf24;border:1px solid rgba(245,158,11,0.2)}
  .score-note{font-size:11px;color:#6b6b80}

  /* Rolling 30-day */
  .rolling-section{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:20px;margin-bottom:28px}
  .rolling-bar-wrap{margin-top:16px}
  .rolling-day{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px}
  .rolling-date{width:80px;color:#6b6b80;flex-shrink:0}
  .rolling-bar-bg{flex:1;background:rgba(255,255,255,0.05);border-radius:4px;height:20px;overflow:hidden;position:relative}
  .rolling-bar-w{position:absolute;left:0;top:0;height:100%;background:rgba(74,222,128,0.5);border-radius:4px;transition:width .4s ease}
  .rolling-bar-l{position:absolute;top:0;height:100%;background:rgba(248,113,113,0.4);border-radius:4px;transition:all .4s ease}
  .rolling-record{width:70px;text-align:right;font-weight:600;color:#c0c0d8;flex-shrink:0}
  .rolling-pct{width:44px;text-align:right;font-weight:700;flex-shrink:0}

  .empty-state{text-align:center;padding:40px;color:#4b4b60;font-size:14px}
  .loading{text-align:center;padding:40px;color:#6b6b80}
  .error-msg{background:rgba(248,113,113,0.08);border:1px solid rgba(248,113,113,0.2);border-radius:8px;padding:14px;color:#f87171;font-size:13px;margin-bottom:20px}

  @media(max-width:600px){
    .picks-table th:nth-child(4),.picks-table td:nth-child(4){display:none}
    .stat-value{font-size:24px}
  }
</style>
</head>
<body>

<div class="header">
  <h1>📊 InsideProps – Pick Record History</h1>
  <p>Verified results for every pick. Updated daily at 1:00 AM MT.</p>
</div>

<div class="container">

  <!-- Overall record -->
  <div id="recordBanner" class="record-banner">
    <div class="stat-card loading" id="overallCard">
      <div class="stat-label">Season Record</div>
      <div class="stat-value" id="overallRecord">–</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Win %</div>
      <div class="stat-value yellow" id="overallPct">–</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Last 30 Days</div>
      <div class="stat-value green" id="rolling30">–</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Last 7 Days</div>
      <div class="stat-value" id="rolling7">–</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Tracking Since</div>
      <div class="stat-value" style="font-size:18px;color:#9090a8" id="trackingStart">–</div>
    </div>
  </div>

  <!-- Rolling 30-day chart -->
  <div class="rolling-section">
    <div class="section-title">📈 Daily Breakdown (Last 30 Days)</div>
    <div id="rollingChart" class="rolling-bar-wrap">
      <div class="loading">Loading chart...</div>
    </div>
  </div>

  <!-- Date picker -->
  <div class="section-title" style="margin-bottom:10px">📅 Browse by Date</div>
  <div id="dateBtns" class="date-grid">
    <div class="loading">Loading dates...</div>
  </div>

  <div id="errorMsg" class="error-msg" style="display:none"></div>

  <!-- Day detail panels (generated dynamically) -->
  <div id="dayPanels"></div>

</div>

<script>
const HISTORY_URL = 'https://raw.githubusercontent.com/CHermes83/insideprops-picks/main/picks_history.json';
const RECORD_URL  = 'https://raw.githubusercontent.com/CHermes83/insideprops-picks/main/season_record.json';

function fmtDate(d) {
  const [y,m,day] = d.split('-');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return months[parseInt(m)-1] + ' ' + parseInt(day) + ', ' + y;
}
function sportTag(s) {
  return `<span class="sport-tag sport-${(s||'nba').toLowerCase()}">${(s||'NBA').toUpperCase()}</span>`;
}
function resultTag(r) {
  const map = {
    WIN:  '<span class="result-tag result-win">WIN</span>',
    LOSS: '<span class="result-tag result-loss">LOSS</span>',
    PUSH: '<span class="result-tag result-push">PUSH</span>',
    VOID: '<span class="result-tag result-void">VOID</span>',
    W:    '<span class="result-tag result-win">WIN</span>',
    L:    '<span class="result-tag result-loss">LOSS</span>',
    P:    '<span class="result-tag result-push">PUSH</span>',
  };
  return map[r] || '<span class="result-tag result-pending">PENDING</span>';
}
function norm(r) {
  if (!r) return 'PENDING';
  const up = r.toUpperCase();
  if (up === 'WIN' || up === 'W') return 'WIN';
  if (up === 'LOSS' || up === 'L') return 'LOSS';
  if (up === 'PUSH' || up === 'P') return 'PUSH';
  if (up === 'VOID') return 'VOID';
  return 'PENDING';
}

let allPicks = [];
let seasonRecord = {};

async function load() {
  try {
    const [histResp, recResp] = await Promise.all([
      fetch(HISTORY_URL + '?t=' + Date.now()),
      fetch(RECORD_URL  + '?t=' + Date.now())
    ]);
    allPicks = await histResp.json();
    seasonRecord = await recResp.json();
  } catch(e) {
    try {
      const r = await fetch(HISTORY_URL);
      allPicks = await r.json();
    } catch(e2) {
      document.getElementById('errorMsg').style.display = 'block';
      document.getElementById('errorMsg').textContent = 'Could not load pick history. Please try again later.';
      return;
    }
  }
  render();
}

function render() {
  // Group by date
  const byDate = {};
  allPicks.forEach(p => {
    if (!byDate[p.date]) byDate[p.date] = [];
    byDate[p.date].push(p);
  });
  const dates = Object.keys(byDate).sort();

  // Compute stats per date
  function dayStats(picks) {
    let w=0, l=0, push=0, v=0, pend=0;
    picks.forEach(p => {
      const n = norm(p.result);
      if (n === 'WIN')  w++;
      else if (n === 'LOSS')  l++;
      else if (n === 'PUSH')  push++;
      else if (n === 'VOID')  v++;
      else pend++;
    });
    return {w,l,push,v,pend};
  }

  // Overall record (from JSON if available, else compute)
  let totalW = seasonRecord.wins ?? 0;
  let totalL = seasonRecord.losses ?? 0;
  let totalP = seasonRecord.pushes ?? 0;
  if (!seasonRecord.wins) {
    allPicks.forEach(p => {
      const n = norm(p.result);
      if (n === 'WIN') totalW++;
      else if (n === 'LOSS') totalL++;
      else if (n === 'PUSH') totalP++;
    });
  }
  const pct = totalW + totalL > 0 ? Math.round(totalW / (totalW + totalL) * 100) : 0;

  document.getElementById('overallRecord').textContent = `${totalW}W-${totalL}L`;
  document.getElementById('overallPct').textContent = `${pct}%`;

  // Rolling 30 and 7
  const today = new Date();
  const day30ago = new Date(today); day30ago.setDate(today.getDate() - 30);
  const day7ago  = new Date(today); day7ago.setDate(today.getDate() - 7);
  let r30w=0, r30l=0, r7w=0, r7l=0;
  allPicks.forEach(p => {
    const d = new Date(p.date + 'T12:00:00');
    const n = norm(p.result);
    if (d >= day30ago) { if (n==='WIN') r30w++; else if (n==='LOSS') r30l++; }
    if (d >= day7ago)  { if (n==='WIN') r7w++;  else if (n==='LOSS') r7l++;  }
  });
  const r30pct = r30w+r30l > 0 ? Math.round(r30w/(r30w+r30l)*100) : 0;
  const r7pct  = r7w+r7l  > 0 ? Math.round(r7w/(r7w+r7l)*100)   : 0;
  document.getElementById('rolling30').textContent = `${r30w}W-${r30l}L`;
  document.getElementById('rolling7').textContent  = `${r7w}W-${r7l}L`;
  document.getElementById('rolling30').className = 'stat-value ' + (r30pct >= 55 ? 'green' : r30pct >= 45 ? 'yellow' : 'red');
  document.getElementById('rolling7').className  = 'stat-value ' + (r7pct  >= 55 ? 'green' : r7pct  >= 45 ? 'yellow' : 'red');
  document.getElementById('trackingStart').textContent = seasonRecord.tracking_start ? fmtDate(seasonRecord.tracking_start) : 'Mar 23, 2026';

  // Rolling chart (last 30 days with data)
  const recentDates = dates.filter(d => new Date(d+'T12:00:00') >= day30ago);
  let chartHtml = '';
  recentDates.forEach(d => {
    const s = dayStats(byDate[d]);
    const total = s.w + s.l;
    const wpct = total > 0 ? Math.round(s.w/total*100) : 0;
    const color = wpct >= 60 ? '#4ade80' : wpct >= 40 ? '#fbbf24' : '#f87171';
    const wWidth = total > 0 ? Math.round(s.w/total*100) : 0;
    const lLeft  = wWidth;
    const lWidth = total > 0 ? Math.round(s.l/total*100) : 0;
    chartHtml += `
      <div class="rolling-day">
        <div class="rolling-date">${fmtDate(d).replace(/, 2026/,'')}</div>
        <div class="rolling-bar-bg">
          <div class="rolling-bar-w" style="width:${wWidth}%"></div>
          <div class="rolling-bar-l" style="left:${lLeft}%;width:${lWidth}%"></div>
        </div>
        <div class="rolling-record">${s.w}W-${s.l}L${s.v ? ' <span style="color:#c084fc;font-size:10px">+${s.v}V</span>' : ''}</div>
        <div class="rolling-pct" style="color:${color}">${wpct}%</div>
      </div>`;
  });
  document.getElementById('rollingChart').innerHTML = chartHtml || '<div class="empty-state">No recent picks found.</div>';

  // Date buttons
  let btnsHtml = '';
  [...dates].reverse().forEach(d => {
    const s = dayStats(byDate[d]);
    const hasPending = s.pend > 0;
    const wpct = s.w+s.l > 0 ? Math.round(s.w/(s.w+s.l)*100) : 0;
    const color = hasPending ? '#fbbf24' : wpct >= 60 ? '#4ade80' : wpct >= 40 ? '#e0e0f0' : '#f87171';
    btnsHtml += `<button class="date-btn has-picks" style="color:${color}" onclick="showDay('${d}')" id="btn-${d}">
      ${fmtDate(d).replace(/, 2026/,'')}<br>
      <span style="font-size:10px;font-weight:400">${s.w}W-${s.l}L${hasPending?' ('+s.pend+' pending)':''}</span>
    </button>`;
  });
  document.getElementById('dateBtns').innerHTML = btnsHtml;

  // Day panels
  let panelsHtml = '';
  dates.forEach(d => {
    const picks = byDate[d];
    const s = dayStats(picks);
    const total = s.w + s.l;
    const wpct = total > 0 ? Math.round(s.w/total*100) : 0;
    let rowsHtml = '';
    picks.forEach(p => {
      const n = norm(p.result);
      rowsHtml += `<tr>
        <td>${sportTag(p.sport)}</td>
        <td style="color:#e0e0f0;font-weight:500">${p.pick}</td>
        <td>${resultTag(p.result)}</td>
        <td class="score-note">${p.score || '—'}</td>
      </tr>`;
    });
    panelsHtml += `<div class="day-panel" id="panel-${d}">
      <div class="day-header">
        <div class="day-title">📅 ${fmtDate(d)}</div>
        <div class="day-record">
          <span class="day-badge badge-w">${s.w} WIN${s.w!==1?'S':''}</span>
          <span class="day-badge badge-l">${s.l} LOSS${s.l!==1?'ES':''}</span>
          ${s.push ? `<span class="day-badge badge-p">${s.push} PUSH${s.push!==1?'ES':''}</span>` : ''}
          ${s.v ? `<span class="day-badge badge-v">${s.v} VOID</span>` : ''}
          ${s.pend ? `<span class="day-badge" style="background:rgba(245,158,11,0.08);color:#fbbf24;border:1px solid rgba(245,158,11,0.2)">${s.pend} PENDING</span>` : ''}
          <span class="win-pct">${total > 0 ? wpct+'% win rate' : 'Results pending'}</span>
        </div>
      </div>
      <table class="picks-table">
        <thead><tr>
          <th>Sport</th><th>Pick</th><th>Result</th><th>Score/Notes</th>
        </tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>`;
  });
  document.getElementById('dayPanels').innerHTML = panelsHtml;

  // Auto-show most recent date
  if (dates.length > 0) showDay(dates[dates.length - 1]);
}

function showDay(date) {
  document.querySelectorAll('.day-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.date-btn').forEach(b => b.classList.remove('active'));
  const panel = document.getElementById('panel-' + date);
  const btn   = document.getElementById('btn-' + date);
  if (panel) { panel.classList.add('active'); panel.scrollIntoView({behavior:'smooth',block:'nearest'}); }
  if (btn) btn.classList.add('active');
}

load();
</script>
</body>
</html>
